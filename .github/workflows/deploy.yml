name: Deploy OmniMail
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Deploy & Migrate DB using Wrangler
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          commands: |
            wrangler d1 migrations apply omnimail-db --remote
            wrangler deploy
          secrets: |
            RESEND_API_KEY
            ADMIN_PASSWORD
            JWT_SECRET
            TURNSTILE_SECRET
